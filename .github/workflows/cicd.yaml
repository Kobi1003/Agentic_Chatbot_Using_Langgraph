name: CI/CD Pipeline — Build, Test & Deploy CHATBOT

on:
  push:
    branches:
      - main
    paths:
      - "CHATBOT/**"
      - ".github/workflows/cicd.yaml"
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - "CHATBOT/**"
    paths-ignore:
      - "**/*.md"
  workflow_dispatch: # Allow manual run from GitHub Actions tab

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Continuous Integration (Syntax Check + Docker Build Verification)
  # ═══════════════════════════════════════════════════════════════════════════
  ci:
    name: CI — Syntax & Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python syntax in CHATBOT/
        run: |
          python -m py_compile CHATBOT/app.py CHATBOT/agentic_chatbot.py CHATBOT/rag_engine.py

      - name: Test Docker image build
        run: |
          docker build -t langgraph-chatbot:ci-test ./CHATBOT

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Continuous Deployment to AWS EC2 via SSH
  # Runs on push to main after CI passes.
  # Set GitHub Secrets (EC2_HOST, EC2_USER, EC2_SSH_KEY) to enable auto-deploy.
  # ═══════════════════════════════════════════════════════════════════════════
  cd-ec2:
    name: CD — Deploy to AWS EC2
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "EC2_HOST / EC2_SSH_KEY secrets not configured — skipping EC2 auto-deploy."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem "${EC2_USER:-ubuntu}@$EC2_HOST" '
            cd ~/Agentic_Chatbot_Using_Langgraph &&
            git pull origin main &&
            cd CHATBOT &&
            docker build -t langgraph-chatbot:latest . &&
            (docker rm -f langgraph-chatbot || true) &&
            docker run -d --name langgraph-chatbot --restart unless-stopped -p 8501:8501 --env-file .env langgraph-chatbot:latest
          '
