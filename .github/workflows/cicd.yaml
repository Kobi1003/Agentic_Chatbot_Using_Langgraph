name: CI/CD Pipeline — Build, Test & Deploy CHATBOT to AWS

on:
  push:
    branches:
      - main
    paths:
      - "CHATBOT/**"
      - ".github/workflows/cicd.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "CHATBOT/**"
  workflow_dispatch: # Allow manual run from GitHub Actions tab

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}          # e.g. ap-south-1 or us-east-1
  ECR_REPOSITORY: langgraph-chatbot

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Continuous Integration (Lint / Syntax Check / Docker Build Verify)
  # ═══════════════════════════════════════════════════════════════════════════
  ci:
    name: CI — Syntax & Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python syntax in CHATBOT/
        run: |
          python -m py_compile CHATBOT/app.py CHATBOT/agentic_chatbot.py CHATBOT/rag_engine.py

      - name: Test Docker image build
        run: |
          docker build -t langgraph-chatbot:ci-test ./CHATBOT

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Continuous Deployment (Push to Amazon ECR & Deploy to AWS App Runner)
  # Runs only on push to main (not on pull requests) after CI passes
  # ═══════════════════════════════════════════════════════════════════════════
  cd-aws:
    name: CD — Push to ECR & Deploy to AWS
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./CHATBOT
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to AWS App Runner
        if: ${{ secrets.APP_RUNNER_SERVICE_ARN != '' }}
        run: |
          aws apprunner start-deployment --service-arn "${{ secrets.APP_RUNNER_SERVICE_ARN }}"
